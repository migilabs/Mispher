# PROTOTYPE, throwaway. Recording device test for Mispher (map ticket #21).
# Generate the Xcode project with XcodeGen: `brew install xcodegen && xcodegen`.
name: RecordingProbe
options:
  bundleIdPrefix: com.migilabs.mispher
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "" # set your Team ID here, or pick the team in Xcode › Signing & Capabilities
targets:
  RecordingProbe:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Rec Probe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Records test audio for the Mispher device test.
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.migilabs.mispher.recordingprobe
    dependencies:
      - target: RecordingProbeWidgets
  RecordingProbeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared/ProbeActivity.swift
      - Shared/ProbeIntents.swift
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Rec Probe Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.migilabs.mispher.recordingprobe.widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
